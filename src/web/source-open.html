<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open source</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    body{margin:0;background:#f5f6f8;color:#111827;}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:min(720px,100%);background:#fff;border:1px solid rgba(15,23,42,.08);border-radius:24px;box-shadow:0 18px 50px rgba(15,23,42,.08);padding:24px;}
    h1{margin:0 0 12px;font-size:28px;line-height:1.1;}
    p{margin:0 0 12px;color:#4b5563;line-height:1.5;}
    .title{font-weight:700;color:#111827;margin:8px 0 10px;}
    .url{word-break:break-word;font-size:13px;color:#6b7280;padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid rgba(15,23,42,.08);}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}
    .btn{appearance:none;border:none;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:999px;font-weight:800;cursor:pointer;}
    .btnPrimary{background:#111827;color:#fff;}
    .btnGhost{background:#fff;color:#111827;border:1px solid rgba(15,23,42,.14);}
    .note{margin-top:16px;font-size:13px;color:#6b7280;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Source opening help</h1>
      <p>Some publishers block direct opens, show a blank page, or expire old feed links. Use one of the options below.</p>
      <div id="storyTitle" class="title"></div>
      <div id="storyUrl" class="url"></div>
      <div class="actions">
        <a id="openOriginal" class="btn btnPrimary" href="#" target="_blank" rel="noopener noreferrer">Open original link</a>
        <a id="searchSource" class="btn btnGhost" href="#" target="_blank" rel="noopener noreferrer">Search this headline</a>
        <button id="copyBtn" class="btn btnGhost" type="button">Copy link</button>
      </div>
      <div class="note">Tip: if the original page stays blank, the headline search usually finds the live article or its updated version.</div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const rawUrl = String(params.get('url') || '').trim();
    const title = String(params.get('title') || '').trim();
    const source = String(params.get('source') || '').trim();
    let domain = '';
    try { domain = rawUrl ? new URL(rawUrl).hostname.replace(/^www\./,'') : ''; } catch {}
    const searchQuery = [title, source ? `site:${domain}` : `site:${domain}`].filter(Boolean).join(' ');
    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(searchQuery || rawUrl || title)}`;
    document.getElementById('storyTitle').textContent = title || source || 'Source link';
    document.getElementById('storyUrl').textContent = rawUrl || 'No URL provided';
    const openOriginal = document.getElementById('openOriginal');
    const searchSource = document.getElementById('searchSource');
    if (rawUrl) openOriginal.href = rawUrl; else openOriginal.setAttribute('aria-disabled', 'true');
    searchSource.href = searchUrl;
    document.getElementById('copyBtn').addEventListener('click', async () => {
      const value = rawUrl || searchUrl;
      try {
        await navigator.clipboard.writeText(value);
        document.getElementById('copyBtn').textContent = 'Copied';
        setTimeout(() => { document.getElementById('copyBtn').textContent = 'Copy link'; }, 1200);
      } catch {}
    });
  </script>
</body>
</html>
