services:
  - type: web
    name: news-app
    env: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python -m uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REQUIRE_EMAIL_VERIFIED
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      # Set OPENAI_API_KEY in Render dashboard (Environment tab), do NOT commit it.
